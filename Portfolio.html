<center><h1>Digital Movie Processing</h1><center>

  <div style="text-align:center">

    <button onclick="playPause()">Play/Pause</button>
    <button onclick="makeBig()">Big</button>
    <button onclick="makeSmall()">Small</button>
    <button onclick="makeNormal()">Normal</button>
    <button onclick="forwardRewind(-2)">Rewind</button>
    <button onclick="forwardRewind(2)">Forward</button>
    <button onclick="toggleMute()">Mute</button>

    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="1"
      oninput="setVolume(this.value)">

    <br><br>

    <video id="myVideo" width="620">
      <source src="videos/JohnsVideoAssignment1.mp4" type="video/mp4">
      <source src="videos/JohnsVideoAssignment1.ogg" type="video/ogg">
      Your browser does not support HTML video.
    </video>

  </div>

  <script>
    var video = document.getElementById("myVideo");

    function playPause() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function makeBig() {
      video.width = 920;
    }

    function makeSmall() {
      video.width = 320;
    }

    function makeNormal() {
      video.width = 620;
    }

    function forwardRewind(seconds) {
      video.currentTime += seconds;
    }

    function toggleMute() {
      video.muted = !video.muted;
    }

    function setVolume(value) {
      video.volume = value;
    }
  </script>
